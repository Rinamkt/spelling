<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#26234d"><title>Spelling Bee · En familia</title><link rel="stylesheet" href="family.css"><script src="words.js" defer></script><script src="game.js" defer></script></head><body><header class="top"><a href="#home" class="brand" data-screen="home"><span class="bee" aria-hidden="true">🐝</span><span>Spelling Bee<small>Aprendemos en familia</small></span></a><button class="profile-button" id="profileButton" aria-label="Elegir o agregar un perfil">Elegir perfil</button></header><main id="content" tabindex="-1"></main><nav class="bottom" aria-label="Navegación principal"><button data-screen="home">🏡<span>Inicio</span></button><button data-screen="parents">🤝<span>Para papás</span></button><button data-screen="library">📚<span>Palabras</span></button><button data-screen="help">💬<span>Ayuda</span></button></nav><dialog id="profiles"><div class="dialog-head"><h2>¿Quién va a practicar?</h2><button id="closeProfiles" class="quiet" aria-label="Cerrar perfiles">✕</button></div><p>Usa un apodo. Cada niño tiene su propio avance en este dispositivo.</p><div id="profileList"></div><form id="profileForm"><label for="nickname">Nuevo apodo</label><input id="nickname" maxlength="24" autocomplete="off" placeholder="Por ejemplo: Riky" required><button class="primary" type="submit">Crear perfil</button></form><p class="small">Los perfiles de este dispositivo no tienen contraseña. No escribas apellidos ni datos de contacto.</p></dialog><div id="notice" role="status" aria-live="polite"></div></body></html>
